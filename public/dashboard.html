<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Viršuje sveikinimas -->
        <header class="dashboard-header">
            <h1 id="welcome-message">Sveikas!</h1>
        </header>

        <div class="dashboard-body">
            <!-- Kairėje pusėje navigacija/mygtukai -->
            <nav class="dashboard-sidebar">
                <button id="add-expense">Pridėti išlaidas</button>
                <button id="logout">Atsijungti</button>
            </nav>

            <!-- Centras paliktas tuščias -->
            <main class="dashboard-main">
                <p>Čia galės atsirasti statistika, grafikai ar kita informacija.</p>
            </main>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
