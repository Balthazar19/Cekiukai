<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Viršuje sveikinimas ir mėnesio pasirinkimas -->
        <header class="dashboard-header">
            <div class="header-content">
                <h1 id="welcome-message">Sveikas!</h1>
                <!-- Mėnesio pasirinkimo dropdown -->
                <div id="month-selector">
                    <label for="month">Pasirinkite mėnesį:</label>
                    <select id="month">
                        <option value="-1">Viso</option>
                        <option value="0">Sausis</option>
                        <option value="1">Vasaris</option>
                        <option value="2">Kovas</option>
                        <option value="3">Balandis</option>
                        <option value="4">Gegužė</option>
                        <option value="5">Birželis</option>
                        <option value="6">Liepa</option>
                        <option value="7">Rugpjūtis</option>
                        <option value="8">Rugsėjis</option>
                        <option value="9">Spalis</option>
                        <option value="10">Lapkritis</option>
                        <option value="11">Gruodis</option>
                    </select>
                </div>
            </div>
        </header>

        <div class="dashboard-body">
            <!-- Kairėje pusėje navigacija/mygtukai -->
            <nav class="dashboard-sidebar">
                <button id="add-expense">Pridėti išlaidas</button>
                <button id="logout">Atsijungti</button>
                <button id="addDummyItemsBtn">Pridėti prekes</button>
            </nav>

            <!-- Pagrindinis turinys -->
            <main class="dashboard-main">
                <div id="expenses-section">
                    <h2>Jūsų išlaidos</h2>
                    <div id="total-expenses">Kraunama...</div>
                </div>
            </main>
        </div>
    </div>
    <div id="check-count">Kraunama...</div>

    <script src="dashboard.js"></script>
</body>
</html>
