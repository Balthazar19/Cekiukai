<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Čekiukai</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Čekiukai</h1>

    <div class="upload-container">
        <input type="file" id="file-input" accept="image/jpeg, image/png, image/jpg">
        <button id="process-btn">Process receipt</button>
    </div>

    <p id="status"></p>
    <div id="image-preview"></div>

    <div id="output">
        <textarea id="ocr-text" rows="10" cols="80" style="display: none;"></textarea><br>
        <div style="margin-top: 10px;">
            <button id="cancel-edit-btn" style="display: none; margin-right: 10px;">Cancel changes</button>
            <button id="save-edited-btn" style="display: none;">Save text</button>
        </div>
    </div>

    <div id="edit-status"></div>

    <script src="index.js" type="module"></script>
</body>
</html>
