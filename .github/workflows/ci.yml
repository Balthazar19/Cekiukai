name: CI Pipeline

on:
  push:
    branches:
      - develop
      - master
      - CEK-*
      - feature/**

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Start backend server in background
        run: |
          nohup node server.js > server.log 2>&1 &
          sleep 5

      - name: Run tests
        run: npm test

      - name: Print server log if tests fail
        if: failure()
        run: cat server.log