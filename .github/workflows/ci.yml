name: CI Pipeline

on:
  push:
    branches:
      - develop
      - master
      - CEK-*
      - feature/**

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Start backend server in background
        run: |
          nohup node server.js > server.log 2>&1 &
          sleep 5

      - name: Run tests and capture output
        run: npm test | tee test-output.log

      - name: Show test-output.log
        run: cat test-output.log

      - name: Fail if any test failed
        run: |
          echo "Checking for test failures..."
          if grep -E "FAILED" test-output.log; then
            echo "One or more tests FAILED"
            exit 1
          else
            echo "No test failures detected"
          fi

      - name: Print server log if tests fail
        if: failure()
        run: cat server.log
